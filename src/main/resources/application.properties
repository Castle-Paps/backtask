spring.application.name=RegistroTareas

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tareas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:3141}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# Server
server.port=${SERVER_PORT:8081}
server.servlet.context-path=/api
server.error.include-stacktrace=never

# JWT
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── Google Drive — OAuth 2.0 Desktop ─────────────────────────────────────────
# En producción estas variables vienen del .env (Docker) o del Run Config (IntelliJ)
# Localmente sin configurar: Drive no disponible pero el resto funciona
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.refresh-token=${GOOGLE_REFRESH_TOKEN:}
google.drive.root-folder=${GOOGLE_DRIVE_ROOT_FOLDER:}

# Logging
logging.level.org.example.registrotareas=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
