spring.application.name=RegistroTareas

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# Server
server.port=${SERVER_PORT}
server.servlet.context-path=/api
server.error.include-stacktrace=never
# Respeta X-Forwarded-* de Cloudflare → las URLs de imágenes salen con el dominio público
server.forward-headers-strategy=framework

# Almacenamiento local de imágenes (carpeta montada como volumen Docker)
#app.uploads-dir=${APP_UPLOADS_DIR:uploads}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Google Drive DESHABILITADO — las imágenes se guardan en el filesystem local (uploads/)

# Logging
logging.level.org.example.registrotareas=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
