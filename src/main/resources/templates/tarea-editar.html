<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar tarea</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-shell">
    <section class="auth-card wide">
        <div class="auth-copy">
            <p class="eyebrow">Tarea #<span th:text="${tarea.id}">0</span></p>
            <h1>Editar tarea</h1>
            <p th:if="${tarea.editado}" style="color: var(--warning);">
                &#9997; Editado por última vez: <span th:text="${#temporals.format(tarea.fechaEdicion, 'dd/MM/yyyy HH:mm')}">-</span>
            </p>
            <p th:unless="${tarea.editado}" style="color: var(--muted);">
                Esta tarea aún no ha sido editada.
            </p>
            <p th:if="${exito}" class="alert success" th:text="${exito}">OK</p>
            <p th:if="${error}" class="alert error" th:text="${error}">Error</p>
        </div>
        <div class="auth-panel">
            <form class="auth-form grid" th:action="@{/tareas/editar/{id}(id=${tarea.id})}" th:method="post" th:object="${request}">
                <label>
                    <span>Cliente</span>
                    <input type="text" th:field="*{nombreCliente}" required>
                </label>
                <label>
                    <span>Teléfono</span>
                    <input type="text" th:field="*{telefono}" required>
                </label>
                <label style="grid-column: 1 / -1;">
                    <span>Motivo</span>
                    <input type="text" th:field="*{motivo}" required style="width:100%;">
                </label>
                <label>
                    <span>Presupuesto (S/)</span>
                    <input type="number" step="0.01" th:field="*{presupuesto}" required>
                </label>
                <label>
                    <span>Adelanto (S/)</span>
                    <input type="number" step="0.01" th:field="*{adelanto}" required>
                </label>
                <label>
                    <span>Método de pago</span>
                    <select th:field="*{metodoPago}" style="width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,0.14);border-radius:14px;color:var(--text);background:rgba(255,255,255,0.06);outline:none;">
                        <option th:each="mp : ${metodosPago}" th:value="${mp.name()}" th:text="${mp.name()}">-</option>
                    </select>
                </label>
                <label>
                    <span>Tiempo (días)</span>
                    <input type="number" th:field="*{tiempoDias}" min="0">
                </label>
                <button type="submit">Guardar cambios</button>
            </form>
            <div class="auth-link" style="margin-top:16px;text-align:center;">
                <a th:href="@{/api/tareas/{id}(id=${tarea.id})}">Ver JSON de la tarea</a>
            </div>
        </div>
    </section>
</main>
</body>
</html>
