services:

  # ── Base de datos ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: registrotareas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-tareas}
      POSTGRES_USER:     ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Solo accesible desde la red interna Docker, NO expuesto al exterior
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Spring Boot ──────────────────────────────────────────────────────
  app:
    build: .
    container_name: registrotareas_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT:      8088
      DB_URL:           jdbc:postgresql://db:5432/${DB_NAME:-tareas}
      DB_USERNAME:      ${DB_USERNAME:-postgres}
      DB_PASSWORD:      ${DB_PASSWORD}
      JWT_SECRET:       ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
    volumes:
      # Los uploads (fotos/videos) persisten fuera del contenedor
      - uploads_data:/app/uploads
    # Solo accesible internamente; Caddy lo expone hacia afuera
    expose:
      - "8088"

  # ── Caddy (proxy inverso + HTTPS automático con Let's Encrypt) ───────────────
  caddy:
    image: caddy:2-alpine
    container_name: registrotareas_caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"     # Redirect HTTP → HTTPS
      - "443:443"   # HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # ── DuckDNS (actualiza la IP dinámica cada 5 minutos) ────────────────────────
  duckdns:
    image: linuxserver/duckdns
    container_name: registrotareas_duckdns
    restart: unless-stopped
    environment:
      - TZ=America/Lima
      - SUBDOMAINS=${DUCKDNS_SUBDOMAIN}   # Solo el nombre, sin .duckdns.org
      - TOKEN=${DUCKDNS_TOKEN}
    volumes:
      - duckdns_config:/config

volumes:
  postgres_data:
  uploads_data:
  caddy_data:
  caddy_config:
  duckdns_config:
